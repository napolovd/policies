<html lang="en">
<head>

  <title>Privacy Policy - CatTorrent</title>
  <!-- The CatTorrent for Android privacy policy moved to the app's own site. GitHub Pages
       cannot send an HTTP redirect, so: an immediate refresh, a script for browsers that
       ignore it, and a link for anything that runs neither. -->

  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=https://cattorrent.com/privacy/android">
  <script>window.location.replace('https://cattorrent.com/privacy/android');</script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 40rem; margin: 4rem auto; padding: 0 1rem; line-height: 1.6; color: #222; }
    a { color: #1976d2; }
  </style>
</head>
<body>
  <h1>CatTorrent Privacy Policy</h1>

</body>
</html>
